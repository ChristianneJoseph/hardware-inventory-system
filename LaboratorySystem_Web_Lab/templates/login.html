{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h2>Account Login</h2>
    <form action="{{ url_for('render_login_page') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required value="{{ locked_username if locked else '' }}">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <div class="auth-links">
        <a href="{{ url_for('render_register_page') }}">Create an Account</a> | 
        <a href="{{ url_for('render_reset_page') }}">Forgot / Reset Password</a>
    </div>
</div>
{% endblock %}
